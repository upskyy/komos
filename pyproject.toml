[project]
name = "komos"
version = "0.0.1"
description = "Korean speech quality MOS prediction"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
keywords = ["speech", "mos", "korean", "whisper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.6",
    "transformers==5.14.1",
    "huggingface-hub>=1.26,<2",
    "safetensors>=0.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.20,<1.24; python_version < '3.11'",
    "onnxruntime>=1.20; python_version >= '3.11'",
]

[project.urls]
Repository = "https://github.com/upskyy/komos"
Model = "https://huggingface.co/upskyy/komos"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "basedpyright>=1.21",
    "pre-commit>=4",
    "onnx>=1.17",
    "onnxruntime>=1.20,<1.24; python_version < '3.11'",
    "onnxruntime>=1.20; python_version >= '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/komos"]

[tool.hatch.build.targets.sdist]
include = ["src/komos", "hubconf.py", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "CPY001"]

[tool.ruff.lint.per-file-ignores]
"src/komos/komos.py" = ["S101"]
"tests/*.py" = ["S101", "PLR2004", "INP001"]

[tool.basedpyright]
typeCheckingMode = "all"
include = ["src/komos", "hubconf.py"]
stubPath = "typings"
